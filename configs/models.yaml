# ============================================
# alpha-bench Model Registry
# ============================================
# This file defines all LLM models to be benchmarked.
# Each model entry specifies provider, features, prompts, and runtime config.
#
# Reference: RFC-001-A Section 6

models:
  # ============================================
  # Claude Code Models (via Anthropic API)
  # ============================================

  - id: claude-code-numeric
    description: "Claude Sonnet 4.5 with numeric features only"
    provider: claude_code
    model_name: claude-sonnet-4-5-20250929
    system_prompt: sys_numeric.txt
    features:
      - price
      - ema_12
      - ema_26
      - macd
      - macd_signal
      - macd_hist
      - rsi_14
      - volume
      - volume_sma_20
    schedule: 6h  # Run every 6 hours
    risk_cap: 0.01  # Max 1% of capital per trade
    max_tokens: 4096
    temperature: 0.2
    enabled: true

  - id: claude-code-text
    description: "Claude Sonnet 4.5 with numeric + text sentiment features"
    provider: claude_code
    model_name: claude-sonnet-4-5-20250929
    system_prompt: sys_text.txt
    features:
      - price
      - ema_12
      - ema_26
      - macd
      - macd_signal
      - macd_hist
      - rsi_14
      - volume
      - volume_sma_20
      - sentiment_news
      - sentiment_social
    schedule: 6h
    risk_cap: 0.01
    max_tokens: 4096
    temperature: 0.2
    enabled: true

  # ============================================
  # Local Models (via llama.cpp)
  # ============================================

  - id: llama-cpp-local
    description: "Local Mistral-7B-Instruct via llama.cpp"
    provider: llama_cpp
    model_path: ./models/mistral-7b-instruct-v0.2.Q4_K_M.gguf
    system_prompt: sys_numeric.txt
    features:
      - price
      - ema_12
      - ema_26
      - macd
      - rsi_14
      - volume
    schedule: daily  # Once per day (slower inference)
    risk_cap: 0.01
    n_ctx: 4096  # Context window
    n_threads: 8  # CPU threads
    temperature: 0.2
    enabled: false  # Disabled by default (requires model download)

  # ============================================
  # Baseline Models (for comparison)
  # ============================================

  - id: baseline-random
    description: "Random action baseline (Monte Carlo control)"
    provider: baseline
    strategy: random
    features: []
    schedule: 6h
    risk_cap: 0.01
    enabled: true

  - id: baseline-trend-following
    description: "Simple trend-following baseline (EMA crossover)"
    provider: baseline
    strategy: ema_crossover
    features:
      - ema_12
      - ema_26
    schedule: 6h
    risk_cap: 0.01
    enabled: true

  # ============================================
  # Experimental Models (add your own)
  # ============================================

  # - id: my-custom-model
  #   description: "My experimental model configuration"
  #   provider: claude_code
  #   model_name: claude-sonnet-4-5-20250929
  #   system_prompt: sys_custom.txt
  #   features:
  #     - price
  #     - ema_12
  #     - rsi_14
  #   schedule: 6h
  #   risk_cap: 0.01
  #   max_tokens: 2048
  #   temperature: 0.3
  #   enabled: false

# ============================================
# Feature Definitions
# ============================================
# Features referenced above are generated by FeatureEngineer
# See: alpha_bench/data/features.py

feature_config:
  # Moving Averages
  ema_12:
    type: technical
    indicator: ema
    period: 12
  ema_26:
    type: technical
    indicator: ema
    period: 26

  # MACD
  macd:
    type: technical
    indicator: macd
    fast_period: 12
    slow_period: 26
    signal_period: 9

  # RSI
  rsi_14:
    type: technical
    indicator: rsi
    period: 14

  # Volume
  volume_sma_20:
    type: technical
    indicator: sma
    source: volume
    period: 20

  # Sentiment (optional, requires API)
  sentiment_news:
    type: text
    source: news_api
    aggregation: weighted_average

  sentiment_social:
    type: text
    source: twitter_api  # or reddit_api
    aggregation: weighted_average

# ============================================
# Provider Defaults
# ============================================

provider_defaults:
  claude_code:
    timeout: 60  # seconds
    retry_attempts: 3
    retry_backoff: 2.0
    rate_limit_rpm: 50  # requests per minute

  llama_cpp:
    timeout: 120
    retry_attempts: 1
    n_batch: 512
    use_mlock: true

  baseline:
    timeout: 5
    retry_attempts: 0

# ============================================
# Versioning
# ============================================

config_version: "1.0.0"
last_updated: "2025-11-10"
schema_version: "RFC-001-A"
